<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G2 stacked clock demo</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui; color: #deecd4; background: #11170e; }
  body { max-width: 650px; padding: 24px; margin: auto; }
  h1 { font-size: 22px; margin: 0 0 8px; } p { color: #a4b598; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
  label { display: grid; gap: 6px; } select,input,button { font: inherit; border: 1px solid #60764e; border-radius: 6px; padding: 8px; background: #202d19; color: inherit; }
  input { width: 62px; } button { cursor: pointer; }
  img { width: 100%; aspect-ratio: 2; background: #000; border: 1px solid #384830; border-radius: 12px; }
  output { font-size: 13px; color: #a4b598; }
</style>
<h1>Stacked clock · compact details</h1>
<p>Live native G2 display. Change the clock treatment here, then swipe in the simulator to check selection.</p>
<div class="controls">
  <label>Hour<input id="hour" type="number" min="1" max="12" value="05"></label>
  <label>Minute<input id="minute" type="number" min="0" max="59" value="48"></label>
  <label>Period<select id="period"><option>PM</option><option>AM</option></select></label>
  <label>Row spacing<select id="spacing"><option value="20">Connected</option><option value="22" selected>Open</option><option value="27">Separated</option></select></label>
  <button id="apply">Update display</button>
</div>
<img id="preview" alt="Native simulator display, on black">
<output id="status">Connecting to simulator…</output>
<script type="module" src="./clock.ts"></script>
</html>
