<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android phone integration fixture</title>
<style>.fixture { padding: 16px; background: #16251d; color: #fff; font: 14px system-ui; } .fixture button { margin: 6px; }</style>
<div class="fixture">
  <strong>Local Android integration fixture</strong>
  <p>Real application and bridge transport, synthetic transcription, no real T3 connection or microphone.
  Start <code>npm run dev:phone</code> first. Pair the debug Android companion to <code>http://10.0.2.2:18789</code>.</p>
  <button id="fixture-audio">Supply synthetic microphone audio</button>
  <span id="fixture-audio-status" role="status"></span>
</div>
<div id="app"></div>
<script type="module">
  import { ImageRawDataUpdateResult } from '@evenrealities/even_hub_sdk'
  import { EvenT3App } from '/src/app.ts'
  import { mountCompanionUi } from '/src/companion-ui.ts'
  const shell = new DOMParser().parseFromString(await (await fetch('/index.html')).text(), 'text/html')
  for (const style of shell.querySelectorAll('style')) document.head.append(style.cloneNode(true))
  const storage = new Map([['t3-code-bridge.connection.v1', JSON.stringify({
    url: 'ws://127.0.0.1:18789/v1/events', token: 'even_phone_fixture_token_local_only_123456789',
  })]])
  let receiveEvent = () => {}
  let microphone = false
  const native = {
    createStartUpPageContainer: async () => 0,
    rebuildPageContainer: async () => true,
    textContainerUpgrade: async () => true,
    updateImageRawData: async () => ImageRawDataUpdateResult.success,
    shutDownPageContainer: async () => true,
    onEvenHubEvent: handler => { receiveEvent = handler; return () => { receiveEvent = () => {} } },
    getLocalStorage: async key => storage.get(key) ?? null,
    setLocalStorage: async (key, value) => { storage.set(key, value); return true },
    getAppLocation: async () => null,
    audioControl: async enabled => { microphone = enabled; return true },
  }
  let app
  const companion = mountCompanionUi(
    request => app.pairAndConnect(request),
    event => app.simulateInput(event),
    (selection, report, signal) => app.runDisplayDiagnostics(selection, report, signal),
    {
      save: settings => app.saveSettings(settings), reload: () => app.refreshSettingsUi(),
      searchLocations: query => app.searchWeatherLocations(query),
      askAssistant: () => app.requestAssistant(),
      createTestNotifications: () => app.createTestNotifications(),
      createPhonePairing: () => app.createPhonePairing(),
      setPhoneAppEnabled: (packageName, enabled) => app.setPhoneAppEnabled(packageName, enabled),
    },
  )
  app = new EvenT3App(native, companion)
  document.getElementById('fixture-audio').onclick = () => {
    const status = document.getElementById('fixture-audio-status')
    if (!microphone) { status.textContent = 'Start dictation first.'; return }
    receiveEvent({ audioEvent: { audioPcm: new Uint8Array(6400) } })
    status.textContent = 'Synthetic audio supplied.'
  }
  await app.start()
  companion.setDiagnosticsReady()
  window.addEventListener('beforeunload', () => app.cleanup())
</script>
</html>
