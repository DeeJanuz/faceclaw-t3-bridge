<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard regression fixture</title>
<style>body { background: #151912; color: #e7eee3; font-family: system-ui; margin: 0; } .fixture { padding: 12px; text-align: center; }</style>
<div class="fixture">Synthetic dashboard fixture. No real T3 requests, microphone capture, or saved profile changes.
  <button id="fixture-alert">Complete another turn</button>
  <button id="fixture-long-weather">Long weather condition</button>
  <button id="fixture-dashboard">Add demo dashboard</button>
  <button id="fixture-plan">Open plan questions</button>
  <button id="fixture-plan-next">Hold menu: next question</button>
  <button id="fixture-plan-previous">Hold menu: previous question</button>
  <button id="fixture-plan-review">Hold menu: review answers</button>
  <button id="fixture-settle">Hold menu: settle session</button>
  <span id="fixture-plan-sent">Plan submissions: 0</span>
  <div id="fixture-gestures" aria-label="Dashboard test controls"></div>
</div>
<div id="app"></div>
<script type="module">
  import { waitForEvenAppBridge, ImageRawDataUpdateResult } from '@evenrealities/even_hub_sdk'
  import { EvenT3App } from '/src/app.ts'
  import { mountCompanionUi } from '/src/companion-ui.ts'
  import { defaultDashboardSettings } from '/src/dashboard-settings.ts'
  import { INPUT_DEFINITIONS } from '/src/input-events.ts'
  const browserMode = new URLSearchParams(location.search).has('browser')
  const native = browserMode ? {
    createStartUpPageContainer: async () => 0, rebuildPageContainer: async () => true,
    textContainerUpgrade: async () => true, updateImageRawData: async () => ImageRawDataUpdateResult.success,
    onEvenHubEvent: () => () => {}, shutDownPageContainer: async () => true,
  } : await waitForEvenAppBridge()
  const store = new Map()
  const nativeCounts = { rebuildPageContainer: 0, updateImageRawData: 0, textContainerUpgrade: 0, sidebarImages: 0, rightImages: 0 }
  const bridge = new Proxy(native, { get(target, key) {
    if (key === 'getLocalStorage') return async key => store.get(key) ?? null
    if (key === 'setLocalStorage') return async (key, value) => { store.set(key, value); return true }
    if (key === 'getAppLocation') return async () => null
    if (key === 'audioControl') return async () => true
    const value = Reflect.get(target, key)
    if (['rebuildPageContainer', 'updateImageRawData', 'textContainerUpgrade'].includes(key)) return async (...args) => {
      const result = await value.apply(target, args)
      nativeCounts[key]++
      if (key === 'updateImageRawData') nativeCounts[args[0].containerID < 11 ? 'sidebarImages' : 'rightImages']++
      console.info('dashboard-fixture-native-counts', JSON.stringify(nativeCounts))
      return result
    }
    return typeof value === 'function' ? value.bind(target) : value
  } })
  let app
  const phone = mountCompanionUi(async () => {}, type => app.simulateInput(type),
    (selection, report, signal) => app.runDisplayDiagnostics(selection, report, signal), {
      save: settings => app.saveSettings(settings), reload: () => app.refreshSettingsUi(),
      searchLocations: query => app.searchWeatherLocations(query), askAssistant: () => app.requestAssistant(),
      createTestNotifications: () => app.createTestNotifications(),
    })
  // Synthetic fixture telemetry lets SDK automation verify navigation without
  // reading the phone mirror or exposing production session content.
  const setMirror = phone.setMirror.bind(phone)
  phone.setMirror = (header, body) => {
    setMirror(header, body)
    console.log('dashboard-fixture-screen', header)
  }
  const recordInput = phone.recordInput.bind(phone)
  phone.recordInput = (label, detail) => {
    recordInput(label, detail)
    console.log('dashboard-fixture-input', label)
  }
  let demoDashboard = false
  app = new EvenT3App(bridge, phone, [{ id: 'demo-news', cards: () => demoDashboard ? [{
    key: 'story', title: 'NEWS EXAMPLE', body: 'A dashboard module\nwith its own content.',
    action: { kind: 'reader', title: 'News example', text: 'This is a synthetic dashboard module. Future RSS headlines or bridge tooling results can use this shared reader.\n\n' + 'Content updates leave the current reading position alone. '.repeat(20) },
  }] : [] }])
  const now = () => new Date().toISOString()
  const project = { id: 'fixture-project', title: 'General assistant', canStartSession: true, updatedAt: now() }
  const demoProjects = [project, ...['BitBooks', 'BZAC', 'Even-Realities'].map((title, index) => ({
    ...project, id: `fixture-project-${index}`, title,
  }))]
  const model = { instanceId: 'fixture', model: 'model', name: 'Fixture model', providerName: 'Fixture', isDefault: true,
    reasoningChoices: [{ id: 'low', label: 'Low', isDefault: true }, { id: 'high', label: 'High', isDefault: false }] }
  const city = { id: '1', name: 'Denver', region: 'Colorado', country: 'United States', latitude: 39.74, longitude: -104.98 }
  let sequence = 1
  const session = { id: 'fixture-thread', title: 'Review plans for the coming week and prepare the next steps', projectId: project.id,
    projectTitle: project.title, settled: false, status: 'idle', lastActivityAt: now(), completedTurn: null }
  const earlier = minutes => new Date(Date.now() - minutes * 60000).toISOString()
  const settledIds = new Set()
  const rawSnapshot = () => ({ snapshotId: String(sequence), frozenAt: now(), unsettled: [
    session,
    { ...session, id: 'fixture-old-unsettled', title: 'Review open tasks', projectId: demoProjects[2].id, projectTitle: demoProjects[2].title, lastActivityAt: earlier(120), completedTurn: null },
    { ...session, id: 'fixture-running', title: 'Check the sync job', projectId: demoProjects[1].id, projectTitle: demoProjects[1].title, status: 'running', lastActivityAt: earlier(180), completedTurn: null },
  ], settled: [
    { ...session, id: 'fixture-settled', title: 'Completed import', projectId: demoProjects[3].id, projectTitle: demoProjects[3].title, settled: true, lastActivityAt: earlier(1), completedTurn: null },
  ] })
  const snapshot = () => {
    const value = rawSnapshot()
    const all = [...value.unsettled, ...value.settled].map(item => ({ ...item, settled: item.settled || settledIds.has(item.id) }))
    return { ...value, unsettled: all.filter(item => !item.settled), settled: all.filter(item => item.settled) }
  }
  document.getElementById('fixture-settle').onclick = () => app.onEvenEvent({ menuItemClickEvent: { itemID: 3 } })
  let condition = new URLSearchParams(location.search).has('long-weather') ? 'Thunderstorm with heavy hail' : 'Clear'
  let pendingPlan = null
  let planSubmissions = 0
  app.client = { connected: true, close() {}, async request(method, params = {}) {
    switch (method) {
      case 'sessions.list': return snapshot()
      case 'projects.list': return { projects: demoProjects }
      case 'models.list': return { models: [model] }
      case 'weather.locations': return { locations: [city, { ...city, id: '2', name: 'Denver', region: 'Iowa' }] }
      case 'weather.current': return { temperatureC: 22, condition, observedAt: now(), fetchedAt: now() }
      case 'voice.start': return { maxBytes: 9600000 }
      case 'voice.finish': return { text: new URLSearchParams(location.search).has('reply-spacing')
        ? 'Yes, I can meet you at noon.\n    Let\'s meet outside the cafe.\n\nI will bring the notes.'
        : 'What should I focus on today?' }
      case 'voice.cancel': return { cancelled: true }
      case 'plan.submit':
        if (!pendingPlan || params.answers.length !== pendingPlan.questions.length) throw new Error('Incomplete or resolved request')
        pendingPlan = null
        document.getElementById('fixture-plan-sent').textContent = `Plan submissions: ${++planSubmissions}`
        return { threadId: params.threadId, requestId: params.requestId, sequence: ++sequence }
      case 'thread.settle': {
        const value = snapshot()
        const item = [...value.unsettled, ...value.settled].find(item => item.id === params.threadId)
        if (!item || ['running', 'starting'].includes(item.status)) throw new Error('Session is working')
        settledIds.add(item.id)
        return { threadId: item.id, settled: true, sequence: ++sequence }
      }
      case 'assistant.start':
        console.log('dashboard-fixture-assistant-start')
        return { threadId: 'fixture-assistant', text: params.text, sequence: ++sequence }
      case 'thread.start':
      case 'turn.send': return { threadId: 'fixture-assistant', text: params.text, sequence: ++sequence }
      case 'transcript.get': return { snapshotId: String(sequence), session: { ...session, id: params.threadId },
        turns: [{ id: 'turn', startedAt: now(), endedAt: now(), durationSeconds: 2, separatorLabel: 'TURN 1', messages: [
          { id: 'message', role: 'assistant', text: 'Start with your most time-sensitive task.\n\nThis is a synthetic response for testing navigation.', streaming: false, createdAt: now(), updatedAt: now() },
        ] }], liveActivity: null, liveActivities: [], pendingPlanInput: pendingPlan }
      default: throw new Error('Unsupported fixture request')
    }
  } }
  app.endpoint = 'ws://127.0.0.1:18787/v1/events'
  app.settings = { ...defaultDashboardSettings(), assistant: { projectId: project.id, modelSelection: { instanceId: 'fixture', model: 'model', reasoningId: 'low' } },
    weather: { enabled: true, unit: 'fahrenheit', fallbackCity: city } }
  await app.display.create()
  app.unsubscribeEvenEvents = native.onEvenHubEvent(event => app.onEvenEvent(event))
  app.connectionLabel = 'Connected'
  app.acceptSessions(snapshot())
  phone.setConnectionStatus('connected', 'Fixture connected')
  await app.refreshSettingsUi()
  await app.openDashboard()
  await app.refreshWeather()
  if (new URLSearchParams(location.search).get('notifications') === 'phone') {
    await app.acceptPhone({ connected: true, permissionGranted: true, apps: [], notifications: [
      { key: 'fixture-phone', revision: '1', packageName: 'org.signal', appName: 'Signal', title: 'Friends', replyable: true,
        text: 'Are we meeting for lunch today?\n\nThis is a synthetic phone message for verifying reader pagination and return navigation. '.repeat(6), arrivedAt: Date.now() },
      { key: 'fixture-phone-two', revision: '1', packageName: 'org.signal', appName: 'Signal', title: 'Project team', replyable: true,
        text: 'The project notes are ready to review.', arrivedAt: Date.now() - 1000 },
    ] }, false)
  } else if (new URLSearchParams(location.search).get('notifications') === 'session') {
    sequence++
    session.completedTurn = { id: `turn-${sequence}`, completedAt: now() }
    app.onBridgeEvent('sessions.changed', snapshot())
  } else if (new URLSearchParams(location.search).has('notifications')) {
    await app.createTestNotifications()
  }
  app.dashboardTimer = window.setInterval(() => {
    if (app.screen === 'dashboard') { void app.renderDashboard(); void app.refreshWeather() }
  }, 60_000)
  phone.setDiagnosticsReady()
  document.getElementById('fixture-dashboard').onclick = () => {
    demoDashboard = !demoDashboard
    document.getElementById('fixture-dashboard').textContent = demoDashboard ? 'Remove demo dashboard' : 'Add demo dashboard'
    void app.refreshDashboards()
  }
  document.getElementById('fixture-plan').onclick = () => {
    if (!pendingPlan) pendingPlan = { requestId: `fixture-plan-${++sequence}`, revision: sequence.toString(16).padStart(64, '0'), turnId: 'turn', createdAt: now(), questions: [
      { id: 'audience', header: 'Audience', question: 'Who should this plan serve?', multiSelect: false, options: [
        { label: 'Just me', description: 'Keep the plan focused on your own daily workflow.' },
        { label: 'Our team', description: 'Include shared responsibilities and handoffs.' },
      ] },
      { id: 'scope', header: 'Scope', question: 'Which parts should the first version include?', multiSelect: true, options: [
        { label: 'Daily overview', description: 'A short list of priorities for the day.' },
        { label: 'Weekly review', description: 'A review of progress and the next steps.' },
      ] },
      { id: 'format', header: 'Format', question: 'How much detail would help you act on this plan without getting in the way when you glance at the glasses?', multiSelect: false, options: [
        { label: 'Short checklist', description: 'Only the actions needed to get started.' },
        { label: 'Detailed guide', description: 'Include the reasoning behind each step and enough context to help a teammate continue the work. Long choices remain readable by swiping through their pages before selecting.' },
      ] },
    ] }
    app.transcriptReturn = app.screen === 'dashboard' ? 'dashboard' : 'sessions'
    app.enqueue(() => app.openTranscript('fixture-thread'))
  }
  for (const [suffix, itemID] of [['next', 20], ['previous', 21], ['review', 22]]) {
    document.getElementById(`fixture-plan-${suffix}`).onclick = () => app.onEvenEvent({ menuItemClickEvent: { itemID } })
  }
  for (const input of INPUT_DEFINITIONS.filter(input => ['Tap', 'Double tap', 'Swipe up', 'Swipe down'].includes(input.label))) {
    const button = document.createElement('button')
    button.textContent = input.label
    button.onclick = () => app.simulateInput(input.eventType)
    document.getElementById('fixture-gestures').append(button)
  }
  document.getElementById('fixture-alert').onclick = () => {
    sequence++
    session.completedTurn = { id: `turn-${sequence}`, completedAt: now() }
    app.onBridgeEvent('sessions.changed', snapshot())
  }
  document.getElementById('fixture-long-weather').onclick = () => {
    condition = 'Thunderstorm with heavy hail'
    app.weather.reset()
    void app.refreshWeather(true)
  }
  window.addEventListener('beforeunload', () => app.cleanup())
  console.log('dashboard-fixture-ready')
  if (new URLSearchParams(location.search).has('banner') && app.phone.notifications.length) {
    window.setTimeout(async () => {
      await app.acceptPhone({ ...app.phone, notifications: app.phone.notifications.map((item, index) => index !== (new URLSearchParams(location.search).has('banner-other') ? 1 : 0) ? item : {
        ...item, revision: '2', text: 'Lunch is at noon.\n\n' + item.text,
      }) })
      console.log('dashboard-fixture-phone-banner')
    }, Number(new URLSearchParams(location.search).get('banner-delay')) || 3000)
  }
  // Optional native automation scenario: while the inbox is open, verify live
  // arrivals preserve its selection, then remove all samples and return home.
  if (new URLSearchParams(location.search).has('updates')) {
    window.setTimeout(async () => {
      await app.createTestNotifications()
      console.log('dashboard-fixture-arrival', app.screen, app.notificationItems.length)
    }, 5000)
    window.setTimeout(async () => {
      app.testNotifications = []
      await app.refreshDashboards()
      console.log('dashboard-fixture-cleared', app.screen, app.dashboardSelection)
    }, 10000)
  }
</script>
</html>
