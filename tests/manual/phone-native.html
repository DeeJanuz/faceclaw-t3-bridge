<!doctype html><html><title>Native phone notification renderer</title><body><p>Native SDK renderer fixture. Synthetic notifications only.</p>
<script type="module">
import { waitForEvenAppBridge } from '@evenrealities/even_hub_sdk'
import { GlassesDisplay, voiceOverlay } from '/src/glasses-display.ts'
const bridge = await waitForEvenAppBridge()
const display = new GlassesDisplay(bridge)
await display.create()
const scene = new URLSearchParams(location.search).get('scene') ?? 'reader'
const dashboard = { header: 'HOME', body: '', dashboard: { left: '10:30 AM\nSep 5\nPhone connected', actions: [{key:'notifications',label:'Notifications (2)',selected:true},{key:'assistant',label:'Assistant',selected:false},{key:'sessions',label:'Sessions',selected:false}], panel: {hour:'10',minute:'30',period:'AM',date:'Sat 09/05',batteryPercent:80,connection:'Connected',weather:[],unread:2} } }
const reader = { header: 'Signal · Friends', body: '09/05/2026, 10:30\nAre we meeting for lunch today?\n\nTap: reply | Hold: dismiss' }
const frame = scene === 'dashboard' ? dashboard : scene === 'dictation' ? voiceOverlay(reader, 'LISTENING | 3S', 'To: Signal · Friends\nYes, see you at noon.') : reader
await display.render({ ...frame, banner: 'WhatsApp · Jamie\nCan you bring the project notes?' })
console.info('Native phone fixture ready', scene)
</script></body></html>
