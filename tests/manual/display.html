<!doctype html>
<meta charset="utf-8">
<title>Glasses display regression</title>
<p>Glasses-only layout test. Click cycles transcript, dictation, review, cancel, live activity, settled.</p>
<script type="module">
  import { waitForEvenAppBridge } from '@evenrealities/even_hub_sdk'
  import { GlassesDisplay, voiceOverlay } from '/src/glasses-display.ts'
  const native = await waitForEvenAppBridge()
  let upload = 0
  const slowImages = new URLSearchParams(location.search).has('slowImages')
  const renderingBridge = slowImages ? new Proxy(native, {
    get(target, key) {
      if (key === 'updateImageRawData') return async (data) => {
        const result = await target.updateImageRawData(data)
        console.log('slow-image', ++upload)
        await new Promise(resolve => setTimeout(resolve, 500))
        return result
      }
      const value = Reflect.get(target, key)
      return typeof value === 'function' ? value.bind(target) : value
    },
  }) : native
  const display = new GlassesDisplay(renderingBridge)
  const body = Array.from({ length: 9 }, (_, index) => `${index + 1} ${'M'.repeat(34)}`).join('\n')
  const updatedBody = body.replaceAll('M', 'N')
  const frames = [
    { header: 'TRANSCRIPT', body },
    voiceOverlay({ header: 'TRANSCRIPT', body }, 'LISTENING | 3S', 'Show the project status before sending.'),
    voiceOverlay({ header: 'TRANSCRIPT', body: updatedBody }, 'REVIEW | TAP TO SEND', 'Show the project status before sending.'),
    { header: 'TRANSCRIPT', body: updatedBody },
    { header: 'LIVE', body: 'The response is arriving.\n', activity: { kind: 'thinking', frame: 3, lineIndex: 1 } },
    { header: 'SETTLED', body: 'Final response.\nNo thinking indicator should remain.' },
  ]
  let index = 0
  await display.create()
  await display.render(frames[index])
  native.onEvenHubEvent(async () => {
    index = (index + 1) % frames.length
    await display.render(frames[index])
    console.log('display-test', { index })
  })
  console.log('display-test-ready')
</script>
