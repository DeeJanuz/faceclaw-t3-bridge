<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion diagnostics regression</title>
<style>body { margin: 0; background: #171a16; color: #e7eee3; font-family: system-ui; }</style>
<div id="app"></div>
<script type="module">
  // Regression driver only. Reuse the real companion and app startup rather
  // than constructing another UI or another glasses renderer. Not packaged.
  await import('/src/main.ts')
  const { waitForEvenAppBridge, OsEventTypeList } = await import('@evenrealities/even_hub_sdk')
  const bridge = await waitForEvenAppBridge()
  let step = 0
  bridge.onEvenHubEvent(event => {
    const type = event.sysEvent?.eventType ?? event.textEvent?.eventType ?? event.listEvent?.eventType
    if (type !== OsEventTypeList.LONG_PRESS_EVENT) return
    const actions = ['test-production-card', 'restore-display', 'test-all-layouts', 'test-production-card']
    const id = actions[step++ % actions.length]
    const button = document.getElementById(id)
    button.scrollIntoView({ block: 'start' })
    button.click()
    console.info('companion-regression-click', id, 'disabled', button.disabled)
  })
  console.info('companion-regression-ready')
</script>
